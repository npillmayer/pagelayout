<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Minimal page template</title>
</head>
<body>
  <!-- One 300 × 200 CSS-pixel page with a single receiving frame.
       Inline styles keep this first example self-contained and easy to read. -->
  <template id="note" data-type="page">
    <div style="width:300px;height:200px;background:#ffffff">
      <div style="position:fixed;left:20px;top:20px;width:260px;height:160px;flow-from:main"></div>
    </div>
  </template>
</body>
</html>
