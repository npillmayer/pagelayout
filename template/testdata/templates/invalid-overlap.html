<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Atomic collection failure</title>
  <style>
    .page { width: 300px; height: 200px; }
    .frame {
      position: fixed; left: 20px; top: 20px;
      width: 100px; height: 100px;
      flow-from: article-flow;
    }
    .overlapping { left: 50px; }
  </style>
</head>
<body>
  <template id="valid" data-type="page">
    <div class="page"><div class="frame"></div></div>
  </template>
  <template id="overlap" data-type="page">
    <div class="page">
      <div class="frame"></div>
      <div class="frame overlapping"></div>
    </div>
  </template>
</body>
</html>
